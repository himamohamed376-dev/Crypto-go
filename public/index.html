<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تداول العملات - Trading Chart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🚀 منصة التداول</h1>
            <div id="userInfo">
                <span id="username">مرحباً، زائر</span>
                <span id="balance">💰 الرصيد: $10,000</span>
                <button id="logoutBtn">🚪 تسجيل خروج</button>
            </div>
        </header>

        <main>
            <section id="priceSection">
                <h2>📈 سعر BTC/USDT</h2>
                <div id="priceDisplay">
                    <span id="currentPrice">$0.00</span>
                    <span id="priceChange">+0.00%</span>
                </div>
                <div id="chartContainer">
                    <canvas id="tradingChart" width="600" height="300"></canvas>
                </div>
            </section>

            <section id="tradingSection">
                <div id="tradeForm">
                    <h3>📊 تنفيذ صفقة</h3>
                    
                    <div class="form-group">
                        <label>اتجاه الصفقة:</label>
                        <div class="direction-buttons">
                            <label class="direction-btn up">
                                <input type="radio" name="direction" value="UP" checked>
                                ⬆️ UP
                            </label>
                            <label class="direction-btn down">
                                <input type="radio" name="direction" value="DOWN">
                                ⬇️ DOWN
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>المبلغ ($):</label>
                        <input type="number" id="tradeAmount" placeholder="أدخل المبلغ" min="1" max="10000" step="1">
                        <div class="quick-amounts">
                            <button onclick="document.getElementById('tradeAmount').value=10">$10</button>
                            <button onclick="document.getElementById('tradeAmount').value=50">$50</button>
                            <button onclick="document.getElementById('tradeAmount').value=100">$100</button>
                            <button onclick="document.getElementById('tradeAmount').value=500">$500</button>
                            <button onclick="document.getElementById('tradeAmount').value=1000">$1,000</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>مدة الصفقة:</label>
                        <div class="duration-buttons">
                            <button class="duration-btn" data-duration="30">30s</button>
                            <button class="duration-btn active" data-duration="60">60s</button>
                            <button class="duration-btn" data-duration="120">2m</button>
                            <button class="duration-btn" data-duration="300">5m</button>
                            <button class="duration-btn" data-duration="600">10m</button>
                        </div>
                        <input type="hidden" id="selectedDuration" value="60">
                    </div>

                    <button id="placeTradeBtn">🚀 تنفيذ الصفقة</button>
                </div>

                <div id="tradesList">
                    <h3>📋 صفقاتي</h3>
                    <div id="tradesTable"></div>
                </div>

                <div id="statistics">
                    <h3>📊 الإحصائيات</h3>
                    <div id="statsContainer"></div>
                </div>
            </section>
        </main>

        <div id="notification"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
